<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Device Lab — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A0E14;
    --bg-panel:#0F1420;
    --line:#1E2634;
    --ink:#EAF0F7;
    --ink-dim:#8592A6;
    --cyan:#54D6C9;
    --amber:#E8A94B;
    --white:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Sora', sans-serif;
    background:var(--bg-panel);
    color:var(--ink);
    min-height:100vh;
  }
  .stage{
    display:flex;
    min-height:100vh;
    width:100%;
  }

  /* ---------- LEFT: visual panel ---------- */
  .visual-panel{
    position:relative;
    flex:1.05;
    background:
      radial-gradient(circle at 30% 20%, rgba(84,214,201,0.10), transparent 45%),
      var(--bg-deep);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:420px;
  }

  .grid-overlay{
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(84,214,201,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(84,214,201,0.055) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%, black 5%, transparent 72%);
    mask-image:radial-gradient(circle at 50% 45%, black 5%, transparent 72%);
  }

  .topology{ position:absolute; inset:0; }
  .topology line{
    stroke:rgba(84,214,201,0.22);
    stroke-width:1;
    stroke-dasharray:4 5;
    animation:dash 12s linear infinite;
  }
  @keyframes dash{ to{ stroke-dashoffset:-200; } }
  .node{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px 1px rgba(84,214,201,0.7);
    animation:blink 3.4s ease-in-out infinite;
  }
  .node.amber{ background:var(--amber); box-shadow:0 0 8px 1px rgba(232,169,75,0.7); }
  @keyframes blink{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  .window-controls{
    position:absolute; top:22px; right:26px;
    display:flex; gap:9px; z-index:5;
  }
  .window-controls span{
    width:11px; height:11px; border-radius:50%;
    display:inline-block; border:1px solid rgba(255,255,255,0.08);
  }
  .wc-min{ background:#5C4A24; }
  .wc-max{ background:#1F4A3D; }
  .wc-close{ background:#5C2430; }

  /* laptop rig */
  .rig{
    position:relative;
    z-index:2;
    animation:hover 5s ease-in-out infinite;
  }
  @keyframes hover{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-14px); }
  }
  .laptop{ width:300px; position:relative; }
  .laptop svg{ display:block; width:100%; height:auto; overflow:visible; }

  .holo-wrap{
    position:absolute;
    left:50%; bottom:100%;
    transform:translateX(-50%);
    width:150px; height:150px;
    z-index:3;
    animation:holofloat 4.6s ease-in-out infinite;
  }
  @keyframes holofloat{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(-9px); }
  }
  .beam{
    position:absolute;
    left:50%; bottom:0;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:58px solid transparent;
    border-right:58px solid transparent;
    border-top:128px solid rgba(84,214,201,0.10);
    filter:blur(2px);
    animation:beamflicker 2.6s ease-in-out infinite;
  }
  @keyframes beamflicker{
    0%,100%{ opacity:.75; }
    45%{ opacity:1; }
    50%{ opacity:.4; }
    55%{ opacity:1; }
  }
  .holo-device{
    position:absolute;
    left:50%; top:2px;
    transform:translateX(-50%);
    width:96px;
    z-index:2;
    animation:flicker 3.2s ease-in-out infinite;
  }
  .holo-device svg{ display:block; width:100%; height:auto; overflow:visible; }
  @keyframes flicker{
    0%,100%{ opacity:.92; }
    48%{ opacity:1; }
    50%{ opacity:.5; }
    52%{ opacity:1; }
  }
  .scan-line{ animation:scan 2.6s linear infinite; }
  @keyframes scan{
    0%{ transform:translateY(-44px); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.9; }
    100%{ transform:translateY(44px); opacity:0; }
  }
  .screen-glow{
    filter:drop-shadow(0 0 26px rgba(84,214,201,0.35));
  }
  .led{
    animation:ledpulse 2.1s ease-in-out infinite;
  }
  @keyframes ledpulse{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }

  .rig-shadow{
    position:absolute;
    bottom:-34px; left:50%;
    transform:translateX(-50%);
    width:210px; height:18px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.55), transparent 70%);
    animation:shadowpulse 5s ease-in-out infinite;
    z-index:1;
  }
  @keyframes shadowpulse{
    0%,100%{ opacity:.55; transform:translateX(-50%) scale(1); }
    50%{ opacity:.3; transform:translateX(-50%) scale(0.82); }
  }

  .caption{
    position:absolute; bottom:26px; left:30px;
    display:flex; align-items:center; gap:8px;
    color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    z-index:5;
  }
  .caption svg{ flex-shrink:0; }

  /* ---------- RIGHT: auth panel ---------- */
  .auth-panel{
    flex:1;
    background:var(--bg-panel);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 32px;
  }
  .auth-inner{ width:100%; max-width:380px; }

  .brand{
    display:flex; align-items:center; gap:10px;
    margin-bottom:56px;
  }
  .brand-mark{
    width:30px; height:30px;
    border-radius:8px;
    background:linear-gradient(160deg, var(--cyan), #2E8C82);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:16px; height:16px; }
  .brand-name{
    font-size:17px; font-weight:700; letter-spacing:0.2px;
  }

  h1{
    font-size:34px;
    font-weight:700;
    line-height:1.18;
    margin:0 0 16px;
    letter-spacing:-0.3px;
  }
  h1 span{ color:var(--cyan); }

  .subtext{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.6;
    margin:0 0 36px;
    max-width:34ch;
  }

  .google-button{
    width:100%;
    display:flex; align-items:center; justify-content:center;
    gap:12px;
    background:var(--white);
    color:#1B1B1B;
    border:none;
    border-radius:8px;
    padding:14px 18px;
    font-family:'Sora', sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .google-button:hover{
    box-shadow:0 8px 22px rgba(0,0,0,0.35);
    transform:translateY(-1px);
  }
  .google-button:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
  }
  .google-logo{
    width:18px; height:18px;
    flex-shrink:0;
  }

  .fineprint{
    display:flex; align-items:flex-start; gap:8px;
    margin-top:22px;
    color:var(--ink-dim);
    font-size:12.5px;
    line-height:1.6;
  }
  .fineprint svg{ margin-top:2px; flex-shrink:0; }
  .fineprint a{ color:var(--cyan); text-decoration:none; }
  .fineprint a:hover{ text-decoration:underline; }

  @media (max-width:820px){
    .stage{ flex-direction:column; }
    .visual-panel{ min-height:300px; }
    .auth-panel{ padding:40px 24px 64px; }
  }

  @media (prefers-reduced-motion:reduce){
    .rig, .node, .led, .holo-wrap, .beam, .holo-device, .scan-line, .rig-shadow, .topology line{
      animation:none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="visual-panel">
    <div class="grid-overlay"></div>

    <svg class="topology" width="100%" height="100%">
      <line x1="12%" y1="22%" x2="30%" y2="38%"></line>
      <line x1="30%" y1="38%" x2="20%" y2="62%"></line>
      <line x1="78%" y1="18%" x2="62%" y2="34%"></line>
      <line x1="62%" y1="34%" x2="80%" y2="55%"></line>
      <line x1="18%" y1="78%" x2="38%" y2="68%"></line>
      <line x1="72%" y1="80%" x2="58%" y2="66%"></line>
    </svg>
    <div class="node" style="top:22%; left:12%;"></div>
    <div class="node amber" style="top:38%; left:30%; animation-delay:.6s;"></div>
    <div class="node" style="top:62%; left:20%; animation-delay:1.1s;"></div>
    <div class="node" style="top:18%; left:78%; animation-delay:.3s;"></div>
    <div class="node amber" style="top:34%; left:62%; animation-delay:1.6s;"></div>
    <div class="node" style="top:55%; left:80%; animation-delay:.9s;"></div>
    <div class="node" style="top:78%; left:18%; animation-delay:2s;"></div>
    <div class="node" style="top:66%; left:58%; animation-delay:1.3s;"></div>
    <div class="node amber" style="top:80%; left:72%; animation-delay:.5s;"></div>

    <div class="window-controls">
      <span class="wc-min"></span>
      <span class="wc-max"></span>
      <span class="wc-close"></span>
    </div>

    <div class="rig">
      <div class="laptop screen-glow">

        <div class="holo-wrap">
          <div class="beam"></div>
          <div class="holo-device">
            <svg viewBox="0 0 110 120" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <clipPath id="deviceClip">
                  <path d="M55 6 L102 26 L102 92 L55 112 L8 92 L8 26 Z"/>
                </clipPath>
              </defs>
              <path d="M55 6 L102 26 L55 46 L8 26 Z" fill="rgba(84,214,201,0.12)" stroke="#54D6C9" stroke-width="1.3"/>
              <path d="M8 26 L55 46 L55 112 L8 92 Z" fill="rgba(84,214,201,0.05)" stroke="#54D6C9" stroke-width="1.3"/>
              <path d="M102 26 L55 46 L55 112 L102 92 Z" fill="rgba(84,214,201,0.09)" stroke="#54D6C9" stroke-width="1.3"/>
              <rect class="scan-line" x="8" y="44" width="94" height="2.4" fill="#EAF0F7" opacity="0.85" clip-path="url(#deviceClip)"/>
            </svg>
          </div>
        </div>

        <svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
          <!-- screen -->
          <rect x="55" y="8" width="190" height="128" rx="8" fill="#141B27" stroke="#2A3444" stroke-width="2"/>
          <rect x="66" y="19" width="168" height="106" rx="2" fill="#0B1119"/>
          <!-- status led -->
          <circle class="led" cx="222" cy="14" r="2.6" fill="#54D6C9"/>
          <!-- emitter glow on screen -->
          <ellipse cx="150" cy="118" rx="46" ry="8" fill="#54D6C9" opacity="0.18"/>
          <ellipse cx="150" cy="118" rx="18" ry="4" fill="#54D6C9" opacity="0.4"/>
          <!-- base -->
          <path d="M30 150 L270 150 L286 186 Q288 194 278 194 L22 194 Q12 194 14 186 Z" fill="#1B2330" stroke="#2A3444" stroke-width="2"/>
          <path d="M40 150 L260 150 L260 156 L40 156 Z" fill="#0F1420"/>
          <rect x="126" y="169" width="48" height="6" rx="3" fill="#2A3444"/>
        </svg>
      </div>
    </div>
    <div class="rig-shadow"></div>

    <div class="caption">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8592A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4"></path>
        <path d="M5 8a7 7 0 0 1 14 0"></path>
        <path d="M2 13a10 10 0 0 1 20 0"></path>
        <circle cx="12" cy="20" r="1.4" fill="#8592A6" stroke="none"></circle>
      </svg>
      Projecting a live device hologram
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-inner">

      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0A0E14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 L20 7.5 L12 12 L4 7.5 Z"></path>
            <path d="M4 7.5 V16 L12 20.5 V12"></path>
            <path d="M20 7.5 V16 L12 20.5"></path>
          </svg>
        </div>
        <div class="brand-name">Click</div>
      </div>

      <h1>See every device <span>as a hologram</span></h1>
      <p class="subtext">Click lets you create and scan your hardware while projecting it as a live 3D hologram.</p>

      <button class="google-button" id="googleSignInBtn">
        <svg class="google-logo" viewBox="0 0 533.5 544.3">
          <path d="M533.5 278.4c0-17.4-1.5-34.1-4.3-50.4H272v95.3h146.9c-6.4 34.7-25.2 64.1-53.8 83.8v69h87c51-47 80.4-116 80.4-197.7z" fill="#4285F4"/>
          <path d="M272 544.3c72.6 0 133.6-24 178.1-65l-87-69c-24.2 16.2-55 25.7-91.1 25.7-69.9 0-129-47.2-150.2-110.6H32v69c44.5 88 135 149 240 149z" fill="#34A853"/>
          <path d="M121.8 324c-10.7-31.8-10.7-66 0-97.8v-69H32C11.6 206 .1 241 .1 278s11.5 72 .1 109h89.7z" fill="#FBBC05"/>
          <path d="M272 107c39.5-.6 77 14 105.9 40l79-79C405 .9 340-.8 272 .1c-105 .1-195.5 61-240 149l89.8 69C143 .2 202 .1 272 .1z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <div class="fineprint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8592A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
      </div>

    </div>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="login.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        document.body.addEventListener("click", (event) => {
            console.log("CLICK DETECTED:", event.target);
        });
    });
</script>

</body>
</html>
